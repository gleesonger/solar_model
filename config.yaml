timezone: Europe/Dublin

logging:
  level: INFO

database:
  path: solar.db

dashboard:
  host: 0.0.0.0
  port: 8090
  actuals_to_forecast:
    pv1: East
    pv2: West

actuals:
  data_retrival_schedule:
    live_update_interval_seconds: 1
    full_updated_interval_seconds: 60
  modbus:
    host: 192.168.1.130
    port: 502
    timeout_seconds: 5
    default_device_id: 247


additional_device_info:
  inverter_ac_to_dc_efficiency: 0.970
  inverter_dc_to_ac_efficiency: 0.974
  battery_charge_efficiency: 0.970
  battery_discharge_efficiency: 0.970

tariffs:
  periods:
    - effective_from: "2000-01-01"
      name: "Electric Ireland - Energysaver Nightsaver"
      import:
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: night
          start_time: "00:00"
          end_time: "08:00"
          rate: 0.2003
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: day
          start_time: "08:00"
          end_time: "23:00"
          rate: 0.4062
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: night
          start_time: "23:00"
          end_time: "24:00"
          rate: 0.2003
      export:
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          start_time: "00:00"
          end_time: "24:00"
          rate: 0.195
    - effective_from: "2026-09-12"
      name: "Yuno Energy - EV Variable Smart"
      import:
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: night
          start_time: "00:00"
          end_time: "02:00"
          rate: 0.2146
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: EV
          start_time: "02:00"
          end_time: "06:00"
          rate: 0.0859
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: night
          start_time: "06:00"
          end_time: "08:00"
          rate: 0.2146
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: day
          start_time: "08:00"
          end_time: "17:00"
          rate: 0.4047
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: peak
          start_time: "17:00"
          end_time: "19:00"
          rate: 0.4538
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: day
          start_time: "19:00"
          end_time: "23:00"
          rate: 0.4047
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: night
          start_time: "23:00"
          end_time: "24:00"
          rate: 0.2146
      export:
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          start_time: "00:00"
          end_time: "24:00"
          rate: 0.1716
          
forecast:

  load:
    model_calibration_parameters:
      lookback: 42                          # days
      halflife: 14                          # days
      prior_effective_observations: 0.2     # influence after one day of weekend evidence (blending from all days to seperate weekend experiance)

  solar:
    interval_seconds: 3600
    timeout_seconds: 10
    endpoint: https://api.forecast.solar/estimate
    arrays:  # API guidance: https://doc.forecast.solar/api:estimate

      - panel_id: 1             # Local storage ID (1-4); not sent to the API
        name: East              # Unique name used by dashboard.actuals_to_forecast
        latitude: 53.4508401    # Degrees latitude; north positive, south negative
        longitude: -6.15367     # Degrees longitude; east positive, west negative
        declination: 35         # Panel tilt in degrees: 0 horizontal, 90 vertical
        azimuth: -67.5          # Degrees from south: east -90, south 0, west 90
        peak_kw: 6.175          # Installed panel peak power in kWp (API kwp)

      - panel_id: 2             # Local storage ID (1-4); not sent to the API
        name: West              # Unique name used by dashboard.actuals_to_forecast
        latitude: 53.4508401    # Degrees latitude; north positive, south negative
        longitude: -6.15367     # Degrees longitude; east positive, west negative
        declination: 35         # Panel tilt in degrees: 0 horizontal, 90 vertical
        azimuth: 112.5          # Degrees from south: east -90, south 0, west 90
        peak_kw: 5.225          # Installed panel peak power in kWp (API kwp)
        
    model_calibration_parameters:
      day_ahead:
        lookback: 42                          # How many previous days data is used in the solar model
        halflife: 14                          # how recent data is weighted
        prior_effective_observations: null    # no prior in this model
      intraday:
        lookback: null                        # all earlier completed hours today; optional limit in hours
        halflife: 1                           # hours
        prior_effective_observations: 0.3333  # Controls how strongly today’s completed hours adjust the solar forecast - 1 hour weights 33%

energy_plan:
  plan_rerun_frequency_mins: 5
  calculation_timeout_seconds: 300
  num_projection_hours: 48
  num_visible_projection_hours: 24

  preferred_reserve_kwh: 3
  protection_preference: 50
  
  scenarios:
    solar:
      low: {multiplier: 0.5, probability: 0.2}
      med: {multiplier: 1.0, probability: 0.6}
      high: {multiplier: 1.5, probability: 0.2}
    house_load:
      low: {multiplier: 0.7, probability: 0.2}
      med: {multiplier: 1.0, probability: 0.6}
      high: {multiplier: 1.5, probability: 0.2}
  
  min_forced_charge_power_kw: 0.1
  min_forced_discharge_power_kw: 0.1
  max_forced_charge_power_kw: 999
  max_forced_discharge_power_kw: 999
  
  optimiser:
    # model - mix_integer_linear_prog, dynamic_programming
    model: dynamic_programming
  
    mix_integer_linear_prog:
      projection_resolution_mins: [15*4, 60*23, 240*6]
  
    dynamic_programming:
      use_numba: true
      projection_resolution_mins: [15*96, 60*24]
      refinement_stages:
        - {grid_step_percent: 2, power_divisions: 5, band_percent: null}
        - {grid_step_percent: 1, power_divisions: 10, band_percent: 5}
        - {grid_step_percent: 1, power_divisions: 20, band_percent: 3}
        - {grid_step_percent: 1, power_divisions: 100, band_percent: 1}
  
  minimum_battery_kwh:
    - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      name: Night
      start_time: "00:00"
      end_time: "24:00"
      rate: 0
  
  maximum_battery_kwh:
    - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      start_time: "00:00"
      end_time: "24:00"
      rate: 999
  
  limit_battery_export_rate_to_grid_kw:
    - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      start_time: "02:00"
      end_time: "06:00"
      rate: 0



