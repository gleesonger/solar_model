services:
  solar-model:
    build:
      context: "https://github.com/gleesonger/solar_model.git#master"
    user: "1000:1000"
    environment:
      NUMBA_CACHE_DIR: /config/.numba-cache
      SOLAR_MODEL_PORT: 8090
    ports:
      - 8090:8090
    volumes:
      - ./solar-model:/config
    restart: unless-stopped
