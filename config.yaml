timezone: Europe/Dublin

logging:
  level: INFO

database:
  path: solar.db

dashboard:
  host: 0.0.0.0
  port: 8090
  actuals_to_forecast:
    pv1: 1
    pv2: 2



tariffs:
  periods:
    - effective_from: "2000-01-01"
      name: "Electric Ireland - Energysaver Nightsaver"
      import:
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: night
          start_time: "00:00"
          end_time: "08:00"
          rate: 0.2003
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: day
          start_time: "08:00"
          end_time: "23:00"
          rate: 0.4062
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: night
          start_time: "23:00"
          end_time: "24:00"
          rate: 0.2003
      export:
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          start_time: "00:00"
          end_time: "24:00"
          rate: 0.195
    - effective_from: "2026-09-12"
      name: "Yuno Energy - EV Variable Smart"
      import:
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: night
          start_time: "00:00"
          end_time: "02:05"
          rate: 0.2146
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: EV
          start_time: "02:05"
          end_time: "06:00"
          rate: 0.0859
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: night
          start_time: "06:00"
          end_time: "08:00"
          rate: 0.2146
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: day
          start_time: "08:00"
          end_time: "17:00"
          rate: 0.4047
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: peak
          start_time: "17:00"
          end_time: "19:00"
          rate: 0.4538
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: day
          start_time: "19:00"
          end_time: "23:00"
          rate: 0.4047
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          name: night
          start_time: "23:00"
          end_time: "24:00"
          rate: 0.2146
      export:
        - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          start_time: "00:00"
          end_time: "24:00"
          rate: 0.1716

forecast:
  interval_seconds: 3600
  timeout_seconds: 10
  endpoint: https://api.forecast.solar/estimate
  arrays:
    - panel_id: 1
      name: East
      latitude: 53.4508401
      longitude: -6.15367
      declination: 35
      azimuth: -67.5
      peak_kw: 6.175
    - panel_id: 2
      name: West
      latitude: 53.4508401
      longitude: -6.15367
      declination: 35
      azimuth: 112.5
      peak_kw: 5.225

energy_plan:
  num_projection_hours: 24
  projection_resolution_mins: 15


  load_forecast_historical_lookback_window_days: 42
  load_forecast_historical_lookback_halflife_days: 21
  
  optimisation_weights:
    maximise_profit: 0.95
    maximise_battery: 0.05

  limit_battery_export_rate_to_grid_kw:
    - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      start_time: "00:00"
      end_time: "24:00"
      rate: 999

  minimum_battery_kwh:
    - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      name: Night
      start_time: "00:00"
      end_time: "05:00"
      rate: 0
      comment: Zero rate allows full export
    - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      name: Day
      start_time: "05:00"
      end_time: "22:00"
      rate: 4
      comment: Based on a 0.5kw load 4kwh is circa 8hrs, but likley to be closer to 6 in reality
    - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      name: Evening
      start_time: "22:00"
      end_time: "24:00"
      rate: 2
      comment: Based on a 0.5kw load 2kwh is circa 4hrs

  maximum_battery_kwh:
    - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      start_time: "00:00"
      end_time: "24:00"
      rate: 18

additional_device_info:
  charge_efficiency: 0.95
  discharge_efficiency: 0.95



actuals:
  data_retrival_schedule:
    live_update_interval_seconds: 1
    full_updated_interval_seconds: 60
  modbus:
    host: 192.168.1.130
    port: 502
    timeout_seconds: 5
    default_device_id: 247
