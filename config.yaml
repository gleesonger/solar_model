forecast:

  # Forecast models work by looking at historical data and with greater emphasis on recent data
  # Parameters:
  # lookback: Number of past days included in the forecast history.
  # halflife: Days until an observation has half the weight of a recent one;
  #           lower values favour recent patterns.
  #
  # For some forecasts we can have multiple forecasts with varying degrees of granularity that we blend between.
  #
  # For house-load we create an hourly forecast profile based on three levels of granularity: 1) Single split  every day, 2) 2 breakdowns - weekend/weekday, 3) 7 breakdowns - each day of the week
  #   The more data we get the more we weight towards the more granular data but that takes time (it takes 7 times longer to collect data on Mondays compared to every day)
  #
  # For Solar we weight between the BoD forecast and actual experience based on percentiles. If today's experience puts us at the 80th percntile of recent experience we scale today's BoD forecast - we use the same prior_effective_observations approach as described below
  #
  # Holiday and normal forecasts use separate history streams at all three layers.
  # Each holiday hour without holiday history falls back to the normal-day model.
  # Load lookback counts non-holiday dates for normal forecasts; holidays extend the window.
  # Holiday-only forecasts retain calendar-day lookback. Missing readings stay missing.
  # All layers share their stream window; halflife always uses elapsed calendar days.
  # One prior_effective_observations value controls both blends.
  # prior_effective_observations: Controls each narrower profile's influence on the broader estimate.
  #
  # Officially the below formula are used:
  #   Evidence n is recency-weighted per hour: each observation contributes 2^(-age/halflife).
  #   Specific portion = n*f / (1 - f + n*f), where f = prior_effective_observations.
  #   Valid range: 0 < f <= 1. As f approaches 0, the specific portion approaches 0%.
  #
  # The below table gives a feel on how to set prior_effective_observations. A value around 0.2 is recommended.
  #
  # f     | n=1    | n=2    | n=4    | n=8
  # ------|--------|--------|--------|-------
  # 0     | Invalid| Invalid| Invalid| Invalid
  # 0.25  | 25%    | 40%    | 57.1%  | 72.7%
  # 0.5   | 50%    | 66.7%  | 80%    | 88.9%
  # 0.75  | 75%    | 85.7%  | 92.3%  | 96%
  # 1     | 100%   | 100%   | 100%   | 100%
  #

  load:
    model_calibration_parameters:
      lookback: 35 # 35 non-holiday dates for normal profiles
      halflife: 7
      prior_effective_observations: 0.3

  solar:
    interval_seconds: 3600
    timeout_seconds: 10
    endpoint: https://api.forecast.solar/estimate
    arrays:  # API guidance: https://doc.forecast.solar/api:estimate

      - panel_id: 1             # Local storage ID (1-4); not sent to the API
        name: East              # Unique name used by dashboard.actuals_to_forecast
        latitude: 53.4508401    # Degrees latitude; north positive, south negative
        longitude: -6.15367     # Degrees longitude; east positive, west negative
        declination: 35         # Panel tilt in degrees: 0 horizontal, 90 vertical
        azimuth: -67.5          # Degrees from south: east -90, south 0, west 90
        peak_kw: 6.175          # Installed panel peak power in kWp (API kwp)

      - panel_id: 2             # Local storage ID (1-4); not sent to the API
        name: West              # Unique name used by dashboard.actuals_to_forecast
        latitude: 53.4508401    # Degrees latitude; north positive, south negative
        longitude: -6.15367     # Degrees longitude; east positive, west negative
        declination: 35         # Panel tilt in degrees: 0 horizontal, 90 vertical
        azimuth: 112.5          # Degrees from south: east -90, south 0, west 90
        peak_kw: 5.225          # Installed panel peak power in kWp (API kwp)

    model_calibration_parameters:
      day_ahead:
        lookback: 42                          # How many previous days data is used in the solar model
        halflife: 14                          # how recent data is weighted
        prior_effective_observations: null    # no prior in this model
      intraday:
        lookback: null                        # all earlier completed hours today; optional limit in hours
        halflife: 1                           # hours
        prior_effective_observations: 0.3333  # Controls how strongly today’s completed hours adjust the solar forecast - 1 hour weights 33%

energy_plan:
  plan_rerun_frequency_mins: 5
  calculation_timeout_seconds: 300

  num_projection_hours: 48
  num_visible_projection_hours: 24

  preferred_reserve_kwh: 3
  protection_preference: 50

  history:
    retain_snapshots_frequency_mins: 30
    retain_snapshots_period_days: 30

  scenario_multiplier:
    solar:      {low: 0.5, med: 1.0, high: 1.5}
    house_load: {low: 0.7, med: 1.0, high: 1.5}

  min_forced_charge_power_kw: 0.1
  min_forced_discharge_power_kw: 0.1
  max_forced_charge_power_kw: 999
  max_forced_discharge_power_kw: 999

  optimiser:
    compile_model_to_native_code: true

    projection_resolution_mins: [15*96, 60*24]
    grid_step_percent: 2
    power_divisions: 5

    transition_hours: 1
    transition_matrix:
      solar:
        - [0.6, 0.3, 0.1]
        - [0.2, 0.6, 0.2]
        - [0.1, 0.3, 0.6]
      house_load:
        - [0.6, 0.3, 0.1]
        - [0.2, 0.6, 0.2]
        - [0.1, 0.3, 0.6]


  minimum_battery_kwh:
    - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      name: Night
      start_time: "00:00"
      end_time: "24:00"
      rate: 0

  maximum_battery_kwh:
    - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      name: null
      start_time: "00:00"
      end_time: "24:00"
      rate: 999

  limit_battery_export_rate_to_grid_kw:
    - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      name: null
      start_time: "02:00"
      end_time: "06:00"
      rate: 0



